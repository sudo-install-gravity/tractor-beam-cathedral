[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwtb"
version = "0.1.0"
description = "Gravitational-wave tractor beam: modeling and simulation of engineered gravitational radiation for asteroid deflection"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Tractor Beam Cathedral contributors" }]
keywords = [
    "gravitational-waves",
    "general-relativity",
    "phased-array",
    "asteroid-deflection",
    "planetary-defense",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # <2.5: numpy 2.5's bundled __init__.pyi uses PEP 695 `type` statement
    # syntax unconditionally, which mypy rejects under python_version = "3.10"
    # below (this project's real floor) regardless of which interpreter runs
    # it -- https://github.com/hauntsaninja/mypy_primer/issues/230.
    "numpy>=1.24,<2.5",
    "scipy>=1.10",
    "numba>=0.58",
    "matplotlib>=3.7",
    "astropy>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]
viz = ["pyvista>=0.43"]

[project.urls]
Homepage = "https://github.com/sudo-install-gravity/tractor-beam-cathedral"
Repository = "https://github.com/sudo-install-gravity/tractor-beam-cathedral"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes the `tests` package importable so benchmark helpers can be shared;
# "tools" exposes the CI scripts to their own tests.
pythonpath = ["src", ".", "tools"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY"]
# Physics identifiers match the published equations rather than PEP 8. This is
# deliberate and load-bearing: auditability against a cited source is this
# project's core requirement, and `G_over_c5` is checkable against G/c^5 in a
# way `g_over_c5` is not — lowercase `g` conventionally means surface gravity,
# so "fixing" the case would introduce a genuine physics ambiguity.
#
#   E741 — single-char names (h, r, n, Q, L, I) that ARE the symbols
#   N802 — function/property names like `G_over_c5`, `Q_ddot`
#   N803 — argument names like `Q_ij`, `M`, `R`, `n_hat`
#   N806 — locals like `Lambda`, `P_ij` inside derivations
ignore = ["E741", "N802", "N803", "N806"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
